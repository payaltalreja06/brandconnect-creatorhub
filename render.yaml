services:
  # Backend Service
  - type: web
    name: collabrix-api
    env: node
    plan: free
    region: ohio
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    rootDir: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set this in Render dashboard
      - key: JWT_SECRET
        sync: false # Set this in Render dashboard
      - key: FRONTEND_URL
        fromService:
          name: brand-influencer-frontend
          type: web
          property: url
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Frontend Service
  - type: web
    name: collabrix
    env: static
    plan: free
    region: ohio
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: brand-influencer-backend
          type: web
          property: url
          suffix: /api
      - key: VITE_SOCKET_URL
        fromService:
          name: brand-influencer-backend
          type: web
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
